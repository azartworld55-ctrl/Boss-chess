name: Generate anime catgirl

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anime-art-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate with Animagine XL 4.0
        env:
          IMAGEPIPELINE_API_KEY: ${{ secrets.IMAGEPIPELINE_API_KEY }}
        run: |
          if [ -z "$IMAGEPIPELINE_API_KEY" ]; then
            echo "::error::Add IMAGEPIPELINE_API_KEY in Settings > Secrets and variables > Actions."
            exit 1
          fi

          mkdir -p public/generated
          python - <<'PY'
          import base64, json, os, re, sys
          from pathlib import Path
          from urllib.parse import urlparse
          import requests

          url = "https://imagepipeline.io/sdxl/text2image/v1/run"
          payload = {
              "model_id": "d2bb19dd-26b1-42cd-88c3-9a50ed366c7b",
              "prompt": (
                  "1girl, solo, adult woman, cat girl, cat ears, fluffy cat ears, "
                  "long flowing dark auburn hair, bright amber eyes, gentle confident smile, "
                  "black cat tail, elegant fantasy outfit, fully clothed, white blouse, "
                  "navy blue jacket with gold embroidery, pleated skirt, ribbon, "
                  "standing in a beautiful moonlit Japanese garden, glowing lanterns, "
                  "cherry blossom petals, soft magical particles, detailed flowers, "
                  "beautiful anime illustration, masterpiece, best quality, high detail, "
                  "expressive eyes, delicate lineart, vibrant colors, cinematic lighting, "
                  "full body, portrait composition"
              ),
              "negative_prompt": (
                  "worst quality, low quality, lowres, blurry, jpeg artifacts, "
                  "bad anatomy, bad hands, extra fingers, missing fingers, extra arms, "
                  "extra legs, malformed limbs, poorly drawn face, asymmetrical eyes, "
                  "duplicate, multiple people, cropped, out of frame, text, watermark, "
                  "logo, nsfw, nude, lingerie, revealing clothes"
              ),
              "width": "832",
              "height": "1216",
              "samples": "1",
              "num_inference_steps": "35",
              "safety_checker": True,
              "guidance_scale": 6.5,
              "multi_lingual": "no",
              "embeddings": "",
              "lora_models": "",
              "lora_weights": ""
          }

          response = requests.post(
              url,
              headers={
                  "Content-Type": "application/json",
                  "API-Key": os.environ["IMAGEPIPELINE_API_KEY"],
              },
              json=payload,
              timeout=600,
          )
          response.raise_for_status()
          data = response.content

          # Some deployments return the image directly; others return JSON
          # containing a URL or a base64-encoded image.
          if not (data.startswith(b"\x89PNG") or data.startswith(b"\xff\xd8")):
              try:
                  obj = response.json()
              except Exception:
                  print(data[:1000].decode("utf-8", "replace"))
                  raise RuntimeError("The image service returned neither an image nor JSON.")

              def find_image(value):
                  if isinstance(value, str):
                      if value.startswith("data:image/") and "," in value:
                          return "base64", value.split(",", 1)[1]
                      if value.startswith("https://") or value.startswith("http://"):
                          return "url", value
                      if len(value) > 1000 and re.fullmatch(r"[A-Za-z0-9+/=\n\r]+", value):
                          return "base64", value
                  if isinstance(value, dict):
                      for item in value.values():
                          found = find_image(item)
                          if found:
                              return found
                  if isinstance(value, list):
                      for item in value:
                          found = find_image(item)
                          if found:
                              return found
                  return None

              found = find_image(obj)
              if not found:
                  print(json.dumps(obj, ensure_ascii=False)[:2000])
                  raise RuntimeError("Could not find an image URL or base64 image in the API response.")

              kind, value = found
              if kind == "url":
                  image_response = requests.get(value, timeout=300)
                  image_response.raise_for_status()
                  data = image_response.content
              else:
                  data = base64.b64decode(value)

          if data.startswith(b"\x89PNG"):
              output = Path("public/generated/catgirl-anime.png")
          elif data.startswith(b"\xff\xd8"):
              output = Path("public/generated/catgirl-anime.jpg")
          else:
              raise RuntimeError("The API response did not contain a PNG or JPEG image.")

          output.write_bytes(data)
          print(f"Saved {output} ({len(data)} bytes)")
          PY

      - name: Commit generated artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/generated/catgirl-anime.*
          git commit -m "Add Animagine XL catgirl artwork"
          git push

name: Generate anime test art

on:
  push:
    paths:
      - ".github/workflows/generate-anime-art.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anime-art-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate anime illustration with Pollinations
        env:
          PROMPT: "high quality anime fantasy key visual, an original young adult mage heroine with silver hair and expressive eyes, elegant blue and gold fantasy outfit, holding a glowing spellbook, moonlit magical library with floating runes, cinematic composition, beautiful detailed background, polished anime illustration, clean line art, rich colors"
        run: |
          mkdir -p public/generated
          ENCODED_PROMPT="$(python -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["PROMPT"]))')"
          curl --fail --location --silent --show-error \
            --retry 2 --retry-delay 5 --max-time 300 \
            --user-agent "Mozilla/5.0" \
            "https://image.pollinations.ai/prompt/${ENCODED_PROMPT}?model=flux-anime&width=1024&height=1024&seed=72315&nologo=true" \
            --output public/generated/anime-test.png
          file public/generated/anime-test.png
          test -s public/generated/anime-test.png

      - name: Commit generated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/generated/anime-test.png
          if git diff --cached --quiet; then
            echo "No generated image change to commit."
          else
            git commit -m "Add AI-generated anime test artwork"
            git push
          fi
